<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" />
  <title>ECSend Pro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      color: #e5e7eb;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 60px 24px 24px;
      text-align: center;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 168px;
      height: 168px;
      padding: 14px;
      border-radius: 40px;
      background: #111827;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 26px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: 3px; font-weight: 700; }
    h1 span { color: #22d3ee; }
    .company { margin: 0; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: #6b7280; }
    .status { margin: 8px 0 0; font-size: 14px; color: #9ca3af; }
    .meta { margin: 0; font-size: 11px; color: #4b5563; font-family: Consolas, monospace; }
    .bar { width: 220px; height: 3px; border-radius: 2px; background: #1f2937; overflow: hidden; }
    .bar > i { display: block; width: 40%; height: 100%; background: #22d3ee; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div class="logo"><img src="assets/logo.jpg" alt="ECSend Pro" /></div>
  <h1>ECSend <span>PRO</span></h1>
  <p class="company">Estalingrado Corp</p>
  <div class="bar"><i></i></div>
  <p class="status" id="status">Iniciando...</p>
  <p class="meta" id="meta"></p>
  <script src="js/boot.js"></script>
</body>
</html>
